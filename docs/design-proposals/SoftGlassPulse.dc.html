<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px; background: linear-gradient(180deg, #dadadc 0%, #c7c7ca 45%, #b1b0b4 100%); color: #1b1b1d; display: flex;">

        <div style="display: flex; align-items: center; gap: 7px;">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="6" cy="9" r="4.2" fill="{{accent}}"></circle><circle cx="10.5" cy="6" r="2.6" fill="#1b1b1d"></circle></svg>
          <div style="font-size: 12.5px; letter-spacing: 0.12em;">ki-barometer</div>
        </div>
        <button type="button" aria-label="Abbrechen" style="width: 30px; height: 30px; border-radius: 999px; border: 0; background: #ffffff; box-shadow: 0 2px 10px rgba(30,30,35,0.08); display: flex; align-items: center; justify-content: center; cursor: pointer;">

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; justify-content: space-between; font-size: 10.5px; color: #8d8d93;">

          <span>Frage 2 von 5</span>
        </div>
        <div style="height: 2.5px; border-radius: 999px; background: #e8e8eb; overflow: hidden;"><div style="width: 40%; height: 100%; background: {{accent}}; border-radius: 999px;"></div></div>
      </div>
    </div>

    <!-- Question -->
    <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 6px;">
      <div style="font-size: 9.5px; color: #9a9aa0; letter-spacing: 0.08em; text-transform: uppercase;">Effizienz</div>
      <h1 style="margin: 0; font-size: 22px; font-weight: 400; line-height: 1.25;">Wie viele Stunden hat dir KI diese Woche geschätzt gespart?</h1>
    </div>

    <!-- Choices -->
    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px;">
      <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Gesparte Stunden</legend>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 0 16px; border-radius: 18px; background: rgba(255,255,255,0.62); border: 1px solid rgba(255,255,255,0.45); font-size: 13px; color: #55565a; cursor: pointer;">
        <input type="radio" name="w21" value="none" style="width: 16px; height: 16px; margin: 0; accent-color: #1b1b1d;">Keine
      </label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 0 16px; border-radius: 18px; background: rgba(255,255,255,0.62); border: 1px solid rgba(255,255,255,0.45); font-size: 13px; color: #55565a; cursor: pointer;">
        <input type="radio" name="w21" value="lt_1" style="width: 16px; height: 16px; margin: 0; accent-color: #1b1b1d;">Unter 1 Stunde

      <label style="display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 0 16px; border-radius: 18px; background: #ffffff; box-shadow: 0 8px 28px rgba(30,30,35,0.08); font-size: 13px; font-weight: 500; color: #1b1b1d; cursor: pointer;">
        <input type="radio" name="w21" value="1_3" checked style="width: 16px; height: 16px; margin: 0; accent-color: #1b1b1d;">1–3 Stunden
        <span style="margin-left: auto; width: 6px; height: 6px; border-radius: 999px; background: {{accent}}; display: inline-block;"></span>
      </label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 0 16px; border-radius: 18px; background: rgba(255,255,255,0.62); border: 1px solid rgba(255,255,255,0.45); font-size: 13px; color: #55565a; cursor: pointer;">
        <input type="radio" name="w21" value="3_5" style="width: 16px; height: 16px; margin: 0; accent-color: #1b1b1d;">3–5 Stunden
      </label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 0 16px; border-radius: 18px; background: rgba(255,255,255,0.62); border: 1px solid rgba(255,255,255,0.45); font-size: 13px; color: #55565a; cursor: pointer;">
        <input type="radio" name="w21" value="5_10" style="width: 16px; height: 16px; margin: 0; accent-color: #1b1b1d;">5–10 Stunden

      <label style="display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 0 16px; border-radius: 18px; background: rgba(255,255,255,0.62); border: 1px solid rgba(255,255,255,0.45); font-size: 13px; color: #55565a; cursor: pointer;">
        <input type="radio" name="w21" value="gt_10" style="width: 16px; height: 16px; margin: 0; accent-color: #1b1b1d;">Mehr als 10 Stunden
      </label>
    </fieldset>

    <!-- Footer -->
    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: center; gap: 8px; font-size: 10px; color: #8d8d93; line-height: 1.4;">
        <svg width="12" height="12" viewBox="0 0 14 14" fill="none" aria-hidden="true"><rect x="3" y="6" width="8" height="6" rx="1.5" stroke="#8d8d93" stroke-width="1.2"></rect><path d="M5 6V4.5a2 2 0 0 1 4 0V6" stroke="#8d8d93" stroke-width="1.2"></path></svg>
        Anonym · nur ab 5 Antworten je Abteilung ausgewertet
      </div>
      <div style="display: flex; gap: 10px;">
        <button type="button" style="height: 46px; padding: 0 20px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.45); background: rgba(255,255,255,0.62); font: inherit; font-size: 12.5px; color: #55565a; cursor: pointer;">Zurück</button>
        <button type="button" style="flex-grow: 1; height: 46px; border-radius: 999px; border: 0; background: #ffffff; box-shadow: 0 8px 28px rgba(30,30,35,0.10); font: inherit; font-size: 12.5px; font-weight: 500; color: #1b1b1d; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;">

  }

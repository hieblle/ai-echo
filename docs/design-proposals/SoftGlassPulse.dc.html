    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px;">

      <label style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; border-radius: 16px; background: #ffffff; box-shadow: 0 6px 18px rgba(31,34,38,0.05); font-size: 15px; cursor: pointer;">
